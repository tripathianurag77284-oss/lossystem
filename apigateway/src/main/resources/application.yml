spring:
  application:
    name: apigateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: authservice
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: applicationservice
              uri: http://localhost:8082
              predicates:
                - Path=/api/applications/**

server:
  port: 8080

jwt:
  secret: my-super-secret-key-for-los-system-2026