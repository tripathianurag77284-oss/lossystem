services:
  postgres:
    image: postgres:17-alpine
    container_name: documentservice-postgres
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: documentuser
      POSTGRES_PASSWORD: documentpass
    ports:
      - "5432:5432"
    volumes:
      - documentservice-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documentuser -d documentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  documentservice-postgres-data:
