spring:
  application:
    name: salesservice

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

# =========================
# Swagger / OpenAPI
# =========================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# =========================
# Actuator
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info